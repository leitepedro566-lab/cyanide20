name: Build Cyanide IPA (Manual)

on:
  workflow_dispatch: 

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false  # 👈 修改点 1：关闭自动拉取子模块，避免直接崩溃
          fetch-depth: 0

      - name: Fix and Update Submodules
        # 👈 修改点 2：新增这一步，动态修复缓存并拉取正常的子模块
        run: |
          echo "==> Cleaning up broken submodule references..."
          # 强行从 git 索引中移除失效的子模块（即便报错也会忽略并继续）
          git rm --cached Cyanide/tweaks/private || true
          
          # 清理可能残留的空文件夹
          rm -rf Cyanide/tweaks/private || true
          
          echo "==> Fetching remaining valid submodules..."
          # 手动初始化并更新其他所有正常的子模块
          git submodule update --init --recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: |
          brew install ldid xcbeautify

      - name: Build libxpf.dylib (XPF Framework)
        run: |
          echo "==> Building XPF Framework..."
          cd Cyanide/XPF
          make
          ls -la output/ios/libxpf.dylib
          echo "==> XPF Framework built successfully."

      - name: Make Scripts Executable
        run: |
          chmod +x scripts/build.sh
          chmod +x scripts/release.sh

      - name: Build Project and Package IPA
        env:
          CONFIG: Release
          SDK: iphoneos
        run: |
          ./scripts/build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-Release
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 7
